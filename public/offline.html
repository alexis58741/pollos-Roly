<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#e30613">
    <title>Sin conexión · Pollos Roly</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #121826; background: #f8f9fb; font: 16px system-ui, sans-serif; }
      main { width: min(460px, 100%); padding: 36px; border: 1px solid #e8e8ec; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 16px 48px #10182812; }
      img { width: 76px; height: 76px; object-fit: contain; }
      h1 { margin: 18px 0 8px; font-size: 25px; }
      p { margin: 0; color: #667085; line-height: 1.6; }
      button { margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 10px; color: #fff; background: #e30613; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/pollos-roly-192.png" alt="Pollos Roly">
      <h1>Sin conexión</h1>
      <p>Conéctate a internet para usar Pollos Roly y sincronizar la información de tu negocio.</p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
